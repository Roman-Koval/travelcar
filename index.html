<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Expenses</title>

<style>
body { font-family: Arial; padding: 10px; }
button { margin: 5px; }
.card {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 5px 0;
  border-radius: 10px;
}
</style>
</head>

<body>

<h2>Travel Expenses</h2>

<input id="name" placeholder="Название">
<input id="amount" type="number" placeholder="Сумма">
<button onclick="add()">Add</button>

<br>

<button onclick="exportData()">Export</button>
<button onclick="document.getElementById('fileInput').click()">Import</button>
<input type="file" id="fileInput" style="display:none">

<div id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem('data') || '[]')

function save() {
  localStorage.setItem('data', JSON.stringify(data))
  render()
}

function add() {
  const name = document.getElementById('name').value
  const amount = document.getElementById('amount').value

  if (!name || !amount) return

  data.push({
    id: Date.now(),
    name,
    amount
  })

  save()
}

function remove(id) {
  data = data.filter(i => i.id !== id)
  save()
}

function edit(id) {
  const item = data.find(i => i.id === id)

  const newName = prompt('Название', item.name)
  const newAmount = prompt('Сумма', item.amount)

  if (newName !== null && newAmount !== null) {
    item.name = newName
    item.amount = newAmount
    save()
  }
}

function render() {
  const list = document.getElementById('list')
  list.innerHTML = ''

  data.forEach(item => {
    const div = document.createElement('div')
    div.className = 'card'

    div.innerHTML = `
      <b>${item.name}</b> - €${item.amount}
      <br>
      <button onclick="edit(${item.id})">✏️ Edit</button>
      <button onclick="remove(${item.id})">❌ Delete</button>
    `

    list.appendChild(div)
  })
}

function exportData() {
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'})
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'expenses.json'
  a.click()
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0]
  const reader = new FileReader()

  reader.onload = function(event) {
    try {
      const imported = JSON.parse(event.target.result)

      if (!Array.isArray(imported)) {
        alert('Invalid file')
        return
      }

      data = imported
      save()

    } catch (err) {
      alert('Error reading file')
    }
  }

  reader.readAsText(file)
})

render()
</script>

</body>
</html>
