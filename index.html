<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelCar</title>
<meta name="theme-color" content="#0f172a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#fff;padding:15px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:12px 15px;background:#1e293b;border-radius:12px}
h1{font-size:1.2rem}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:12px}
.voice-btn{width:100%;padding:20px;background:linear-gradient(135deg,#22c55e,#3b82f6);border:none;border-radius:50px;color:#fff;font-size:1.2rem;font-weight:bold;cursor:pointer;margin-bottom:10px}
.voice-btn.recording{animation:pulse 1.5s infinite;background:linear-gradient(135deg,#ef4444,#dc2626)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.7)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;margin-bottom:4px;color:#94a3b8;font-size:0.85rem}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#0f172a;color:#fff;font-size:1rem}
input[readonly]{background:#334155}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin:5px 0;cursor:pointer;font-size:1rem}
.btn-primary{background:#22c55e;color:#fff}
.btn-secondary{background:#334155;color:#fff}
.item{background:#0f172a;padding:12px;border-radius:8px;margin:8px 0;border-left:4px solid #22c55e}
.item-head{display:flex;justify-content:space-between;margin-bottom:5px}
.amount{font-weight:bold;color:#22c55e}
.del-btn{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;margin-top:8px}
#map{height:200px;border-radius:8px;background:#1e293b}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#334155;color:#fff;padding:10px 20px;border-radius:30px;transition:all 0.3s;opacity:0;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:#22c55e}.toast.error{background:#ef4444}
#voiceTxt{text-align:center;color:#94a3b8;margin:8px 0;min-height:20px}
.debug{background:#1e3a5f;padding:10px;border-radius:8px;margin:10px 0;font-size:0.85rem;color:#94a3b8}
</style>
</head>
<body>

<header>
  <h1>🚗 TravelCar</h1>
  <div style="padding:4px 10px;background:rgba(34,197,94,0.2);border:1px solid #22c55e;border-radius:15px;font-size:0.8rem">🟢 Online</div>
</header>

<div class="card">
  <button id="voiceBtn" class="voice-btn" onclick="speak()">🎤 ГОВОРИ</button>
  <div id="voiceTxt"></div>
</div>

<div class="debug" id="debug">
  🔧 Статус: <span id="debugStatus">Загрузка...</span>
</div>
<div class="card">
  <label>💰 Сумма</label>
  <input type="number" id="amt" placeholder="0.00" step="0.01">
  
  <div class="form-row">
    <div>
      <label>Валюта</label>
      <select id="cur">
        <option value="EUR">€ EUR</option>
        <option value="USD">$ USD</option>
        <option value="TRY">₺ TRY</option>
      </select>
    </div>
    <div>
      <label>Категория</label>
      <select id="cat">
        <option value="food">🍔 Еда</option>
        <option value="fuel">⛽ Топливо</option>
        <option value="hotel">🏨 Жильё</option>
        <option value="other">📦 Прочее</option>
      </select>
    </div>
  </div>
  
  <label>📍 Город</label>
  <input type="text" id="loc" placeholder="Авто..." readonly>
  
  <button class="btn btn-primary" onclick="save()">💾 СОХРАНИТЬ</button>
  <button class="btn btn-secondary" onclick="exp()">📤 Экспорт</button>
  <button class="btn btn-secondary" onclick="clearAll()" style="background:#7f1d1d">🗑️ Очистить всё</button>
</div>

<div class="card">
  <div style="text-align:center;font-size:1.3rem;margin-bottom:10px;">
    Всего: <span id="total" style="color:#22c55e;font-weight:bold">€0.00</span>
  </div>
  <div id="list"></div>
</div>

<div class="card">
  <div style="margin-bottom:8px;font-weight:500">🗺️ Карта</div>
  <div id="map"></div>
</div>

<div id="toast" class="toast"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let expenses = [];
let map, markers = [], _lat, _lng;

// Инициализация
window.addEventListener('load', () => {
  console.log('🚀 App loading...');
  
  // Init map
  map = L.map('map').setView([50, 10], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  
  // Load from localStorage
  loadLocal();
  
  document.getElementById('debugStatus').textContent = 'Готов к работе (localStorage)';
  console.log('✅ App loaded');
});

// Voice
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { 
    toast('❌ Открой в Chrome', 'error'); 
    return; 
  }
  
  const r = new SR();
  r.lang = 'ru-RU';
  r.interimResults = false;
  
  const btn = document.getElementById('voiceBtn');
  const txt = document.getElementById('voiceTxt');
  
  btn.classList.add('recording');
  btn.innerHTML = '🎙️ Слушаю...';
  txt.textContent = 'Говорите...';
  
  r.onresult = async e => {
    const t = e.results[0][0].transcript;
    txt.textContent = `"${t}"`;
    parse(t);
    await getLoc();
    setTimeout(save, 1000);
  };
  
  r.onerror = e => {
    console.error('Voice error:', e.error);
    txt.textContent = 'Ошибка: ' + e.error;
    toast('Ошибка: ' + e.error, 'error');    resetBtn();
  };
  
  r.onend = resetBtn;
  
  try { r.start(); }
  catch(e) { 
    console.error(e); 
    toast('Ошибка запуска', 'error'); 
    resetBtn(); 
  }
}

function resetBtn() {
  const btn = document.getElementById('voiceBtn');
  const txt = document.getElementById('voiceTxt');
  btn.classList.remove('recording');
  btn.innerHTML = '🎤 ГОВОРИ';
  setTimeout(() => { if(txt) txt.textContent = ''; }, 2000);
}

// Parse
function parse(text) {
  const lower = text.toLowerCase();
  
  const m = lower.match(/(\d+[.,]?\d*)/);
  const amount = m ? parseFloat(m[1].replace(',', '.')) : 0;
  
  let cur = 'EUR';
  if (/лир|try/i.test(lower)) cur = 'TRY';
  else if (/дол|usd|\$/i.test(lower)) cur = 'USD';
  
  let cat = 'food';
  if (/бензин|топливо|газ|fuel/i.test(lower)) cat = 'fuel';
  else if (/отель|гостиниц|hotel/i.test(lower)) cat = 'hotel';
  
  document.getElementById('amt').value = amount || '';
  document.getElementById('cur').value = cur;
  document.getElementById('cat').value = cat;
  
  toast(`✅ ${amount} ${cur}`, 'success');
}

// Geolocation
async function getLoc() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      document.getElementById('loc').value = 'N/A';
      resolve();
      return;    }
    
    navigator.geolocation.getCurrentPosition(async pos => {
      _lat = pos.coords.latitude;
      _lng = pos.coords.longitude;
      
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${_lat}&lon=${_lng}&format=json`);
        const d = await r.json();
        const city = d.address?.city || d.address?.town || 'Unknown';
        document.getElementById('loc').value = city;
      } catch(e) {
        document.getElementById('loc').value = `${_lat.toFixed(2)}, ${_lng.toFixed(2)}`;
      }
      resolve();
    }, () => {
      document.getElementById('loc').value = 'No GPS';
      resolve();
    }, { timeout: 5000 });
  });
}

// Save to localStorage
function save() {
  const amount = parseFloat(document.getElementById('amt').value);
  const currency = document.getElementById('cur').value;
  const category = document.getElementById('cat').value;
  const city = document.getElementById('loc').value;
  
  if (!amount || amount <= 0) {
    toast('❌ Введите сумму', 'error');
    return;
  }
  
  const rates = { EUR: 1, USD: 0.92, TRY: 0.029 };
  const eur = amount * (rates[currency] || 1);
  
  const item = {
    id: Date.now().toString(),
    amount,
    currency,
    category,
    eur,
    city,
    lat: _lat,
    lng: _lng,
    date: new Date().toISOString()
  };
  
  expenses.unshift(item);  saveLocal();
  render();
  
  document.getElementById('amt').value = '';
  document.getElementById('loc').value = '';
  toast('✅ Сохранено!', 'success');
}

// Delete
function del(id) {
  if (!confirm('Удалить?')) return;
  expenses = expenses.filter(e => e.id !== id);
  saveLocal();
  render();
  toast('Удалено', 'success');
}

// Clear all
function clearAll() {
  if (!confirm('Очистить ВСЕ записи?')) return;
  expenses = [];
  saveLocal();
  render();
  toast('Очищено', 'success');
}

// localStorage
function saveLocal() {
  localStorage.setItem('travelcar_expenses', JSON.stringify(expenses));
  console.log('💾 Saved to localStorage:', expenses.length, 'items');
}

function loadLocal() {
  try {
    const data = localStorage.getItem('travelcar_expenses');
    if (data) {
      expenses = JSON.parse(data);
      console.log('📦 Loaded from localStorage:', expenses.length, 'items');
    }
  } catch(e) {
    console.error('Load error:', e);
    expenses = [];
  }
  render();
}

// Render
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';  
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  
  let total = 0;
  
  if (expenses.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#666;padding:30px">📭 Нет записей<br><small>Нажми 🎤 и скажи "пицца 30 евро"</small></div>';
    document.getElementById('total').textContent = '€0.00';
    return;
  }
  
  expenses.forEach(e => {
    total += e.eur || 0;
    
    const div = document.createElement('div');
    div.className = 'item';
    
    const date = new Date(e.date);
    const dateStr = date.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    
    const cats = { food:'🍔 Еда', fuel:'⛽ Топливо', hotel:'🏨 Жильё', other:'📦 Прочее' };
    
    div.innerHTML = `
      <div class="item-head">
        <span class="amount">${e.amount} ${e.currency}</span>
        <span style="color:#94a3b8">€${(e.eur||0).toFixed(2)}</span>
      </div>
      ${e.city ? `<div style="color:#94a3b8;font-size:0.9rem;margin:3px 0">📍 ${e.city}</div>` : ''}
      <div style="font-size:0.8rem;color:#666;margin:3px 0">${cats[e.category] || '📦'} • ${dateStr}</div>
      <button class="del-btn" onclick="del('${e.id}')">🗑️ Удалить</button>
    `;
    list.appendChild(div);
    
    if (e.lat && e.lng) {
      const m = L.marker([e.lat, e.lng]).addTo(map);
      m.bindPopup(`<b>${e.amount} ${e.currency}</b><br>€${(e.eur||0).toFixed(2)}<br>${e.city||''}`);
      markers.push(m);
    }
  });
  
  document.getElementById('total').textContent = `€${total.toFixed(2)}`;
  
  if (markers.length > 0) {
    const bounds = L.latLngBounds(markers.map(m => m.getLatLng()));
    map.fitBounds(bounds.pad(0.1));
  }
}

// Exportfunction exp() {
  if (expenses.length === 0) {
    toast('Нет данных', 'error');
    return;
  }
  const blob = new Blob([JSON.stringify(expenses, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `travelcar-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  toast('Экспортировано', 'success');
}

// Toast
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
