<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelCar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}
h1{margin-bottom:15px;font-size:1.3rem}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:12px;font-size:1.1rem;cursor:pointer}
.green{background:#22c55e;color:#fff}
.blue{background:#3b82f6;color:#fff}
.red{background:#ef4444;color:#fff}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:1rem}
.item{background:#1e293b;padding:12px;margin:10px 0;border-radius:8px;border-left:4px solid #22c55e}
#map{height:200px;border-radius:8px;background:#1e293b;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 20px;border-radius:30px;display:none}
</style>
</head>
<body>

<h1>🚗 TravelCar</h1>

<button class="blue" onclick="speak()">🎤 ГОВОРИ</button>
<div id="txt" style="text-align:center;color:#94a3b8;margin:10px 0;"></div>

<label>💰 Сумма</label>
<input type="number" id="amt" placeholder="0" step="0.01">

<label>Валюта</label>
<select id="cur">
  <option value="EUR">€ EUR</option>
  <option value="USD">$ USD</option>
  <option value="TRY">₺ TRY</option>
</select>

<label>Категория</label>
<select id="cat">
  <option value="food">🍔 Еда</option>
  <option value="fuel">⛽ Топливо</option>
  <option value="hotel">🏨 Жильё</option>
</select>

<label>📍 Город</label>
<input type="text" id="loc" placeholder="Авто..." readonly>

<button class="green" onclick="save()">💾 СОХРАНИТЬ</button>
<button class="blue" onclick="exp()">📤 ЭКСПОРТ</button>
<button class="red" onclick="clr()">🗑️ ОЧИСТИТЬ</button>
<div id="list" style="margin-top:20px"></div>
<div id="tot" style="text-align:center;font-size:1.5rem;margin:15px 0;color:#22c55e">€0.00</div>
<div id="map"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script>
let data = [], map, marks = [], lat, lng;

// Init
window.onload = function() {
  console.log('LOAD');
  map = L.map('map').setView([50, 10], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  load();
  render();
  console.log('READY');
};

// Voice
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Открой в Chrome'); return; }
  
  const r = new SR();
  r.lang = 'ru-RU';
  
  document.getElementById('txt').textContent = '🔴 Говорите...';
  
  r.onresult = async function(e) {
    const t = e.results[0][0].transcript;
    document.getElementById('txt').textContent = '"' + t + '"';
    
    // Parse
    const m = t.toLowerCase().match(/(\d+[.,]?\d*)/);
    const amt = m ? parseFloat(m[1].replace(',', '.')) : 0;
    
    let cur = 'EUR';
    if (/лир/i.test(t)) cur = 'TRY';
    else if (/дол/i.test(t)) cur = 'USD';
    
    let cat = 'food';
    if (/бензин|топливо/i.test(t)) cat = 'fuel';
    else if (/отель/i.test(t)) cat = 'hotel';
    
    document.getElementById('amt').value = amt;
    document.getElementById('cur').value = cur;    document.getElementById('cat').value = cat;
    
    // Location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async function(p) {
        lat = p.coords.latitude;
        lng = p.coords.longitude;
        try {
          const res = await fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json');
          const d = await res.json();
          document.getElementById('loc').value = d.address?.city || d.address?.town || 'Unknown';
        } catch(e) {
          document.getElementById('loc').value = lat.toFixed(2) + ', ' + lng.toFixed(2);
        }
        setTimeout(save, 500);
      });
    } else {
      setTimeout(save, 500);
    }
  };
  
  r.onerror = function(e) {
    document.getElementById('txt').textContent = 'Error: ' + e.error;
  };
  
  r.start();
}

// Save
function save() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!amt || amt <= 0) {
    show('❌ Введите сумму');
    return;
  }
  
  const rates = {EUR: 1, USD: 0.92, TRY: 0.029};
  const cur = document.getElementById('cur').value;
  const eur = amt * (rates[cur] || 1);
  
  data.unshift({
    id: Date.now(),
    amt: amt,
    cur: cur,
    cat: document.getElementById('cat').value,
    eur: eur,
    loc: document.getElementById('loc').value,
    lat: lat,
    lng: lng,
    date: new Date().toISOString()  });
  
  localStorage.setItem('tc_data', JSON.stringify(data));
  
  document.getElementById('amt').value = '';
  document.getElementById('loc').value = '';
  document.getElementById('txt').textContent = '';
  
  show('✅ Сохранено!');
  render();
}

// Delete
function del(id) {
  if (!confirm('Delete?')) return;
  data = data.filter(x => x.id !== id);
  localStorage.setItem('tc_data', JSON.stringify(data));
  render();
}

// Clear all
function clr() {
  if (!confirm('Clear ALL?')) return;
  data = [];
  localStorage.removeItem('tc_data');
  render();
}

// Load
function load() {
  try {
    const d = localStorage.getItem('tc_data');
    if (d) data = JSON.parse(d);
  } catch(e) { data = []; }
}

// Render
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  marks.forEach(m => map.removeLayer(m));
  marks = [];
  
  let tot = 0;
  
  if (data.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px">Нет записей</div>';
  } else {
    data.forEach(function(x) {      tot += x.eur || 0;
      
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = '<div style="display:flex;justify-content:space-between"><b>' + x.amt + ' ' + x.cur + '</b><span style="color:#94a3b8">€' + (x.eur||0).toFixed(2) + '</span></div>' +
        (x.loc ? '<div style="color:#94a3b8;font-size:0.9rem;margin:5px 0">📍 ' + x.loc + '</div>' : '') +
        '<button class="red" onclick="del(' + x.id + ')" style="padding:8px;margin-top:8px">🗑️ Удалить</button>';
      list.appendChild(div);
      
      if (x.lat && x.lng) {
        const m = L.marker([x.lat, x.lng]).addTo(map);
        m.bindPopup(x.amt + ' ' + x.cur + '<br>' + (x.loc||''));
        marks.push(m);
      }
    });
  }
  
  document.getElementById('tot').textContent = '€' + tot.toFixed(2);
  
  if (marks.length > 0) {
    const b = L.latLngBounds(marks.map(m => m.getLatLng()));
    map.fitBounds(b.pad(0.1));
  }
}

// Export
function exp() {
  if (data.length === 0) { show('Нет данных'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'travelcar.json';
  a.click();
  show('Exported');
}

// Toast
function show(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}
</script>

</body>
</html>
