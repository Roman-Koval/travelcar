<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelCar</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#fff;padding:15px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:12px 15px;background:#1e293b;border-radius:12px}
h1{font-size:1.2rem}
.status{padding:4px 10px;border-radius:15px;background:rgba(34,197,94,0.2);border:1px solid #22c55e;font-size:0.8rem}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:12px}
.voice-btn{width:100%;padding:20px;background:linear-gradient(135deg,#22c55e,#3b82f6);border:none;border-radius:50px;color:#fff;font-size:1.2rem;font-weight:bold;cursor:pointer;margin-bottom:10px}
.voice-btn.recording{animation:pulse 1.5s infinite;background:linear-gradient(135deg,#ef4444,#dc2626)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.7)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;margin-bottom:4px;color:#94a3b8;font-size:0.85rem}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#0f172a;color:#fff;font-size:1rem}
input[readonly]{background:#334155;opacity:0.9}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin:5px 0;cursor:pointer;font-size:1rem}
.btn-primary{background:#22c55e;color:#fff}
.btn-secondary{background:#334155;color:#fff;border:1px solid rgba(255,255,255,0.1)}
.item{background:#0f172a;padding:12px;border-radius:8px;margin:8px 0;border-left:4px solid #22c55e}
.item-head{display:flex;justify-content:space-between;margin-bottom:5px}
.amount{font-weight:bold;color:#22c55e}
.del-btn{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.8rem;margin-top:8px}
#map{height:200px;border-radius:8px;background:#1e293b}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#334155;color:#fff;padding:10px 20px;border-radius:30px;transition:all 0.3s;opacity:0;z-index:9999;font-size:0.9rem}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:#22c55e}.toast.error{background:#ef4444}
#voiceTxt{text-align:center;color:#94a3b8;margin:8px 0;font-size:0.95rem;min-height:20px}
</style>
</head>
<body>

<header>
  <h1>🚗 TravelCar</h1>
  <div id="status" class="status">🟢 Online</div>
</header>

<div class="card">
  <button id="voiceBtn" class="voice-btn" onclick="speak()">🎤 ГОВОРИ</button>
  <div id="voiceTxt"></div>
</div>

<div class="card">
  <label>💰 Сумма</label>  <input type="number" id="amt" placeholder="0.00" step="0.01" inputmode="decimal">
  
  <div class="form-row">
    <div>
      <label>Валюта</label>
      <select id="cur">
        <option value="EUR">€ EUR</option>
        <option value="USD">$ USD</option>
        <option value="TRY">₺ TRY</option>
        <option value="GBP">£ GBP</option>
      </select>
    </div>
    <div>
      <label>Категория</label>
      <select id="cat">
        <option value="food">🍔 Еда</option>
        <option value="fuel">⛽ Топливо</option>
        <option value="hotel">🏨 Жильё</option>
        <option value="other">📦 Прочее</option>
      </select>
    </div>
  </div>
  
  <label>📍 Город</label>
  <input type="text" id="loc" placeholder="Авто..." readonly>
  
  <button class="btn btn-primary" onclick="save()">💾 СОХРАНИТЬ</button>
  <button class="btn btn-secondary" onclick="exp()">📤 Экспорт</button>
</div>

<div class="card">
  <div style="text-align:center;font-size:1.3rem;margin-bottom:10px;">
    Всего: <span id="total" style="color:#22c55e;font-weight:bold">€0.00</span>
  </div>
  <div id="list"></div>
</div>

<div class="card">
  <div style="margin-bottom:8px;font-weight:500">🗺️ Карта</div>
  <div id="map"></div>
</div>

<div id="toast" class="toast"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 🔥 ТВОЙ FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCCoLJ5RImCdABPKpGHfcNRAIuJCD-g1b4",
  authDomain: "travelcar-feb41.firebaseapp.com",
  projectId: "travelcar-feb41",
  storageBucket: "travelcar-feb41.firebasestorage.app",
  messagingSenderId: "29727766385",
  appId: "1:29727766385:web:3a76950d8b66d8c61068d0",
  measurementId: "G-EX70NM9KRH"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let expenses = [], map, markers = [], user = null, _lat, _lng;

// Инициализация карты
window.addEventListener('load', () => {
  map = L.map('map').setView([50, 10], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OSM',
    maxZoom: 19
  }).addTo(map);
});

// Голос
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('❌ Открой в Chrome', 'error'); return; }
  
  const r = new SR();
  r.lang = 'ru-RU';
  r.interimResults = false;
  
  const btn = document.getElementById('voiceBtn');
  const txt = document.getElementById('voiceTxt');
  
  btn.classList.add('recording');
  btn.innerHTML = '🎙️ Слушаю...';
  txt.textContent = 'Говорите сейчас...';
  
  r.onresult = async e => {
    const t = e.results[0][0].transcript;
    txt.textContent = `"${t}"`;
    parse(t);
    await getLoc();
    setTimeout(save, 800);
  };  
  r.onerror = e => {
    console.error('Voice error:', e.error);
    txt.textContent = 'Ошибка: ' + e.error;
    toast('Ошибка: ' + e.error, 'error');
    resetBtn();
  };
  
  r.onend = resetBtn;
  
  try { r.start(); }
  catch(e) { console.error(e); toast('Ошибка запуска', 'error'); resetBtn(); }
}

function resetBtn() {
  const btn = document.getElementById('voiceBtn');
  const txt = document.getElementById('voiceTxt');
  btn.classList.remove('recording');
  btn.innerHTML = '🎤 ГОВОРИ';
  setTimeout(() => { if(txt) txt.textContent = ''; }, 2000);
}

// Парсинг голоса
function parse(text) {
  const lower = text.toLowerCase();
  
  // Сумма (заменяем запятую на точку)
  const m = lower.match(/(\d+[.,]?\d*)/);
  const amount = m ? parseFloat(m[1].replace(',', '.')) : 0;
  
  // Валюта
  let cur = 'EUR';
  if (/лир|try/i.test(lower)) cur = 'TRY';
  else if (/дол|usd|\$/i.test(lower)) cur = 'USD';
  else if (/фун|gbp|£/i.test(lower)) cur = 'GBP';
  
  // Категория
  let cat = 'food';
  if (/бензин|топливо|газ|заправ|fuel|petrol/i.test(lower)) cat = 'fuel';
  else if (/отель|гостиниц|жильё|ночлег|hotel/i.test(lower)) cat = 'hotel';
  else if (/транспорт|метро|автобус|такси|taxi|metro/i.test(lower)) cat = 'other';
  
  document.getElementById('amt').value = amount || '';
  document.getElementById('cur').value = cur;
  document.getElementById('cat').value = cat;
  
  toast(`✅ ${amount} ${cur} - ${getCatLabel(cat)}`, 'success');
}

function getCatLabel(c) {  const l = {food:'Еда',fuel:'Топливо',hotel:'Жильё',other:'Прочее'};
  return l[c] || 'Прочее';
}

// Геолокация
async function getLoc() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      document.getElementById('loc').value = 'N/A';
      resolve();
      return;
    }
    
    navigator.geolocation.getCurrentPosition(async pos => {
      _lat = pos.coords.latitude;
      _lng = pos.coords.longitude;
      
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${_lat}&lon=${_lng}&format=json&accept-language=ru`);
        const d = await r.json();
        const city = d.address?.city || d.address?.town || d.address?.village || 'Unknown';
        document.getElementById('loc').value = city;
      } catch(e) {
        document.getElementById('loc').value = `${_lat.toFixed(3)}, ${_lng.toFixed(3)}`;
      }
      resolve();
    }, () => {
      document.getElementById('loc').value = 'No GPS';
      resolve();
    }, { timeout: 8000, enableHighAccuracy: true });
  });
}

// Конвертация в евро
function toEUR(amount, currency) {
  const rates = { EUR: 1, USD: 0.92, TRY: 0.029, GBP: 1.17 };
  return amount * (rates[currency] || 1);
}

// Сохранение
async function save() {
  const amount = parseFloat(document.getElementById('amt').value);
  const currency = document.getElementById('cur').value;
  const category = document.getElementById('cat').value;
  const city = document.getElementById('loc').value;
  
  if (!amount || amount <= 0) {
    toast('❌ Введите сумму', 'error');
    return;
  }  
  if (!user) {
    toast('⏳ Ожидание...', 'error');
    setTimeout(save, 1500);
    return;
  }
  
  toast('💾 Сохранение...', 'success');
  
  try {
    await db.collection('expenses').add({
      amount,
      currency,
      category,
      eur: toEUR(amount, currency),
      city,
      lat: _lat || null,
      lng: _lng || null,
      date: firebase.firestore.FieldValue.serverTimestamp(),
      userId: user.uid,
      createdAt: new Date().toISOString()
    });
    
    document.getElementById('amt').value = '';
    document.getElementById('loc').value = '';
    toast('✅ Сохранено!', 'success');
  } catch(e) {
    console.error('Save error:', e);
    toast('Ошибка: ' + e.message, 'error');
  }
}

// Удаление
async function del(id) {
  if (!confirm('Удалить?')) return;
  try {
    await db.collection('expenses').doc(id).delete();
    toast('Удалено', 'success');
  } catch(e) {
    toast('Ошибка', 'error');
  }
}

// Отображение
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  markers.forEach(m => map.removeLayer(m));
  markers = [];  
  let total = 0;
  
  if (expenses.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px">📭 Нет записей</div>';
  }
  
  expenses.forEach(e => {
    total += e.eur || 0;
    
    const div = document.createElement('div');
    div.className = 'item';
    
    const date = e.date?.toDate ? e.date.toDate() : new Date(e.createdAt);
    const dateStr = date.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
    
    div.innerHTML = `
      <div class="item-head">
        <span class="amount">${e.amount} ${e.currency}</span>
        <span style="color:#94a3b8">€${(e.eur||0).toFixed(2)}</span>
      </div>
      ${e.city ? `<div style="color:#94a3b8;font-size:0.9rem">📍 ${e.city}</div>` : ''}
      <div style="font-size:0.8rem;color:#666;margin-top:3px">${getCatLabel(e.category)} • ${dateStr}</div>
      <button class="del-btn" onclick="del('${e.id}')">🗑️ Удалить</button>
    `;
    list.appendChild(div);
    
    if (e.lat && e.lng) {
      const m = L.marker([e.lat, e.lng]).addTo(map);
      m.bindPopup(`<b>${e.amount} ${e.currency}</b><br>€${(e.eur||0).toFixed(2)}<br>${e.city||''}`);
      markers.push(m);
    }
  });
  
  document.getElementById('total').textContent = `€${total.toFixed(2)}`;
  
  if (markers.length > 0) {
    const bounds = L.latLngBounds(markers.map(m => m.getLatLng()));
    map.fitBounds(bounds.pad(0.1));
  }
}

// Экспорт
function exp() {
  if (expenses.length === 0) {
    toast('Нет данных', 'error');
    return;
  }
  const data = expenses.map(e => ({
    date: e.createdAt,    amount: e.amount,
    currency: e.currency,
    eur: e.eur,
    category: getCatLabel(e.category),
    city: e.city
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `travelcar-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  toast('Экспортировано', 'success');
}

// Toast
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Статус соединения
function updateStatus() {
  const s = document.getElementById('status');
  if (navigator.onLine) {
    s.textContent = '🟢 Online';
    s.className = 'status';
  } else {
    s.textContent = '🔴 Offline';
    s.className = 'status';
    s.style.background = 'rgba(239,68,68,0.2)';
    s.style.borderColor = '#ef4444';
  }
}

window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);

// Auth
auth.onAuthStateChanged(u => {
  if (u) {
    user = u;
    console.log('✅ Auth:', u.uid);
    
    db.collection('expenses')
      .where('userId', '==', u.uid)
      .orderBy('date', 'desc')
      .onSnapshot(snap => {
        expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));        console.log('📦 Loaded:', expenses.length);
        render();
      }, err => {
        console.error('Firestore error:', err);
        toast('Ошибка синхронизации', 'error');
      });
  } else {
    console.log('🔄 Anonymous sign-in...');
    auth.signInAnonymously().catch(e => {
      console.error('Auth error:', e);
      toast('Ошибка авторизации', 'error');
    });
  }
});

// Init status
updateStatus();
</script>
</body>
</html>
