<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TravelCar CLOUD</title>
<meta name="description" content="Учет расходов в путешествиях с голосовым вводом">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="travelcar-icon-192.png">
<link rel="apple-touch-icon" href="travelcar-icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-content">
    <h1>🚗 TravelCar CLOUD</h1>
    <div id="connection-status" class="status online">🟢 Online</div>
  </div>
</header>

<main>
  <div class="card voice-card">
    <button id="voiceBtn" onclick="startVoice()" class="voice-btn">
      <span class="btn-icon">🎤</span>
      <span class="btn-text">Голосовой ввод</span>
    </button>
    <div id="voiceStatus" class="voice-status"></div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="amount">💰 Сумма</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="currency">Валюта</label>
        <select id="currency">
          <option value="EUR">€ EUR</option>
          <option value="TRY">₺ TRY</option>          <option value="USD">$ USD</option>
          <option value="GBP">£ GBP</option>
          <option value="CHF">₣ CHF</option>
          <option value="CZK">Kč CZK</option>
          <option value="PLN">zł PLN</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Категория</label>
        <select id="category">
          <option value="food">🍔 Еда</option>
          <option value="fuel">⛽ Топливо</option>
          <option value="hotel">🏨 Жильё</option>
          <option value="transport">🚇 Транспорт</option>
          <option value="shopping">🛍️ Покупки</option>
          <option value="entertainment">🎭 Развлечения</option>
          <option value="other">📦 Прочее</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="comment">📝 Комментарий</label>
      <input type="text" id="comment" placeholder="Описание расхода...">
    </div>

    <div class="form-group">
      <label for="location">📍 Местоположение</label>
      <input type="text" id="location" placeholder="Определяется автоматически..." readonly>
      <button onclick="getGeo()" class="small-btn">🔄 Обновить</button>
    </div>

    <div class="button-group">
      <button onclick="addExpense()" class="btn-primary">💾 Сохранить расход</button>
      <button onclick="exportData()" class="btn-secondary">📤 Экспорт JSON</button>
      <button onclick="exportCSV()" class="btn-secondary">📊 Экспорт CSV</button>
    </div>
  </div>

  <div class="card stats-card">
    <h3>📊 Статистика</h3>
    <div id="stats">
      <div class="stat-item">
        <span class="stat-label">Общая сумма:</span>
        <span class="stat-value" id="totalEUR">€0.00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Записей:</span>
        <span class="stat-value" id="totalCount">0</span>      </div>
      <div id="categoryStats"></div>
    </div>
  </div>

  <div class="card">
    <h3>📋 История расходов</h3>
    <div id="filters" class="filters">
      <select id="filterCategory" onchange="renderExpenses()">
        <option value="all">Все категории</option>
        <option value="food">🍔 Еда</option>
        <option value="fuel">⛽ Топливо</option>
        <option value="hotel">🏨 Жильё</option>
        <option value="transport">🚇 Транспорт</option>
        <option value="shopping">🛍️ Покупки</option>
        <option value="entertainment">🎭 Развлечения</option>
        <option value="other">📦 Прочее</option>
      </select>
    </div>
    <div id="list" class="expense-list"></div>
  </div>

  <div class="card map-card">
    <h3>🗺️ Карта маршрута</h3>
    <div id="map"></div>
  </div>
</main>

<footer>
  <p>TravelCar CLOUD v1.0 • <span id="lastSync">Синхронизация...</span></p>
</footer>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>

</body>
</html>
