<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Travel Car</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#020617" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">TRAVEL<span>.CAR</span></div>
      <button class="icon-btn" id="themeToggle" title="Тема">🌓</button>
    </header>

    <main>
      <!-- Блок поездки -->
      <section class="trip-header">
        <div>
          <div class="trip-name" id="tripName">Поездка 1</div>
          <div class="trip-dates" id="tripDates">Без дат</div>
        </div>
        <div class="trip-right">
          <div class="trip-budget">
            <label>Бюджет, €</label>
            <input type="number" id="tripBudget" min="0" />
          </div>
          <div class="trip-currency">
            <label>Валюта</label>
            <select id="baseCurrency">
              <option value="EUR">EUR — Евро</option>
              <option value="USD">USD — Доллар</option>
              <option value="UAH">UAH — Гривна</option>
              <option value="TRY">TRY — Лира</option>
              <option value="PLN">PLN — Злотый</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Сводка -->
      <section class="summary">
        <div class="summary-card">
          <div class="label">Общие расходы</div>
          <div class="value" id="totalAmount">0,00 €</div>
        </div>
        <div class="summary-card">
          <div class="label">Остаток бюджета</div>
          <div class="value" id="budgetLeft">—</div>
        </div>
        <div class="summary-card">
          <div class="label">Расходов</div>
          <div class="value" id="expenseCount">0</div>
        </div>
      </section>

      <!-- Действия -->
      <section class="actions">
        <button class="primary" id="addExpenseBtn">Добавить расход</button>
      </section>

      <!-- Графики -->
      <section class="charts">
        <div class="chart-card">
          <div class="chart-title">По категориям</div>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">По дням</div>
          <canvas id="dailyChart"></canvas>
        </div>
      </section>

      <!-- Поиск и журнал -->
      <section class="list-header">
        <div class="list-title">Журнал расходов</div>
        <input type="search" id="searchInput" placeholder="Поиск..." />
      </section>

      <section class="expense-list" id="expenseList"></section>
    </main>
  </div>

  <!-- Модалка добавления расхода -->
  <div class="modal-backdrop" id="expenseModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Новый расход</div>
        <button class="icon-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <label>Название</label>
        <input type="text" id="expTitle" placeholder="Например: Заправка, Кофе..." />

        <label>Сумма</label>
        <input type="number" id="expAmount" min="0" step="0.01" />

        <label>Категория</label>
        <select id="expCategory">
          <option value="fuel">Топливо</option>
          <option value="stay">Жильё</option>
          <option value="food">Питание</option>
          <option value="transport">Транспорт</option>
          <option value="fun">Развлечения</option>
          <option value="other">Другое</option>
        </select>

        <label>Дата</label>
        <input type="date" id="expDate" />

        <label>Валюта</label>
        <select id="expCurrency">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="UAH">UAH</option>
          <option value="TRY">TRY</option>
          <option value="PLN">PLN</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="secondary" id="cancelExpense">Отмена</button>
        <button class="primary" id="saveExpense">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
