<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelCar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px}
h1{margin-bottom:15px;font-size:1.3rem}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:12px;font-size:1.1rem;cursor:pointer}
.green{background:#22c55e;color:#fff}
.blue{background:#3b82f6;color:#fff}
.red{background:#ef4444;color:#fff}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:1rem}
.item{background:#1e293b;padding:12px;margin:10px 0;border-radius:8px;border-left:4px solid #22c55e;cursor:pointer;transition:transform 0.2s}
.item:active{transform:scale(0.98)}
.item:hover{border-left-color:#3b82f6}
#map{height:200px;border-radius:8px;background:#1e293b;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 20px;border-radius:30px;display:none;z-index:9999}
.auto{background:#1e3a5f;padding:10px;border-radius:8px;margin:10px 0;text-align:center;font-size:0.9rem}
.auto.on{background:#166534}
.loc{color:#94a3b8;font-size:0.85rem}
.loc.clickable{color:#3b82f6;text-decoration:underline}
</style>
</head>
<body>

<h1>🚗 TravelCar</h1>

<div class="auto" id="autoStatus">🎤 Готов к голосовому вводу</div>

<button class="blue" onclick="speak()">🎤 ГОВОРИ</button>
<div id="txt" style="text-align:center;color:#94a3b8;margin:10px 0;"></div>

<label>💰 Сумма</label>
<input type="number" id="amt" placeholder="0" step="0.01">

<label>Валюта</label>
<select id="cur">
  <option value="EUR">€ EUR (Евро)</option>
  <option value="USD">$ USD (Доллар)</option>
  <option value="TRY">₺ TRY (Лиры)</option>
  <option value="GBP">£ GBP (Фунт)</option>
</select>

<label>Категория</label>
<select id="cat">
  <option value="food">🍔 Еда</option>
  <option value="fuel">⛽ Топливо</option>  <option value="hotel">🏨 Жильё</option>
  <option value="other">📦 Прочее</option>
</select>

<label>📍 Город</label>
<input type="text" id="loc" placeholder="Авто..." readonly>

<button class="green" onclick="save()">💾 СОХРАНИТЬ</button>
<button class="blue" onclick="exp()">📤 ЭКСПОРТ</button>
<button class="red" onclick="clr()">🗑️ ОЧИСТИТЬ</button>

<div id="list" style="margin-top:20px"></div>
<div id="tot" style="text-align:center;font-size:1.5rem;margin:15px 0;color:#22c55e">€0.00</div>
<div id="map"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script>
let data = [], map, marks = [], lat, lng;

// Currency rates TO EUR (1 unit = X EUR)
const EUR_RATES = {
  EUR: 1,
  USD: 0.92,
  TRY: 0.029,
  GBP: 1.17
};

// Init
window.onload = function() {
  console.log('LOAD');
  map = L.map('map').setView([50, 10], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  load();
  render();
  console.log('READY');
};

// Voice
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Открой в Chrome'); return; }
  
  const r = new SR();
  r.lang = 'ru-RU';
  
  const txt = document.getElementById('txt');
  const status = document.getElementById('autoStatus');  
  txt.textContent = '🔴 Слушаю...';
  status.textContent = '🎤 Говорите сейчас...';
  status.className = 'auto';
  
  r.onresult = async function(e) {
    const t = e.results[0][0].transcript;
    txt.textContent = '"' + t + '"';
    status.textContent = '✅ "' + t + '"';
    status.className = 'auto on';
    
    // Parse amount
    const m = t.toLowerCase().match(/(\d+[.,]?\d*)/);
    const amt = m ? parseFloat(m[1].replace(',', '.')) : 0;
    
    // Parse currency
    let cur = 'EUR';
    if (/лир|try/i.test(t)) cur = 'TRY';
    else if (/дол|usd|\$/i.test(t)) cur = 'USD';
    else if (/фун|gbp|£/i.test(t)) cur = 'GBP';
    
    // Parse category
    let cat = 'food';
    if (/бензин|топливо|газ|fuel/i.test(t)) cat = 'fuel';
    else if (/отель|гостиниц|жильё|hotel/i.test(t)) cat = 'hotel';
    else if (/транспорт|метро|автобус|такси/i.test(t)) cat = 'other';
    
    document.getElementById('amt').value = amt;
    document.getElementById('cur').value = cur;
    document.getElementById('cat').value = cat;
    
    status.textContent = '📍 GPS...';
    
    // Get location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async function(p) {
        lat = p.coords.latitude;
        lng = p.coords.longitude;
        
        try {
          const res = await fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json&addressdetails=1&accept-language=ru');
          const d = await res.json();
          
          // Try to get city/town/village
          const city = d.address?.city || d.address?.town || d.address?.village || d.address?.municipality || d.address?.county;
          
          if (city) {
            document.getElementById('loc').value = city;
          } else {
            // Show coordinates if no city            document.getElementById('loc').value = lat.toFixed(4) + ', ' + lng.toFixed(4);
          }
        } catch(e) {
          console.warn('Geo error:', e);
          document.getElementById('loc').value = lat.toFixed(4) + ', ' + lng.toFixed(4);
        }
        
        // Auto save
        status.textContent = '💾 Сохранение...';
        setTimeout(function() {
          autoSave();
        }, 800);
      }, function(err) {
        console.warn('GPS error:', err);
        document.getElementById('loc').value = 'GPS off';
        status.textContent = '💾 Сохранение (без GPS)...';
        setTimeout(function() {
          autoSave();
        }, 800);
      }, { timeout: 8000, enableHighAccuracy: true });
    } else {
      document.getElementById('loc').value = 'No GPS';
      setTimeout(autoSave, 800);
    }
  };
  
  r.onerror = function(e) {
    txt.textContent = 'Ошибка: ' + e.error;
    status.textContent = '❌ Ошибка';
    setTimeout(function() { 
      status.textContent = '🎤 Готов к голосовому вводу';
      status.className = 'auto';
    }, 2000);
  };
  
  r.onend = function() {
    setTimeout(function() { txt.textContent = ''; }, 2000);
  };
  
  r.start();
}

// Auto save
function autoSave() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!amt || amt <= 0) {
    show('❌ Не распознана сумма');
    resetStatus();
    return;
  }  
  const cur = document.getElementById('cur').value;
  const cat = document.getElementById('cat').value;
  const loc = document.getElementById('loc').value;
  
  // Convert to EUR
  const rate = EUR_RATES[cur] || 1;
  const eur = amt * rate;
  
  data.unshift({
    id: Date.now(),
    amt: amt,
    cur: cur,
    cat: cat,
    eur: eur,
    loc: loc,
    lat: lat,
    lng: lng,
    date: new Date().toISOString()
  });
  
  localStorage.setItem('tc_data', JSON.stringify(data));
  
  document.getElementById('amt').value = '';
  document.getElementById('loc').value = '';
  
  show('✅ ' + amt + ' ' + cur + ' = €' + eur.toFixed(2));
  status.textContent = '✅ Сохранено!';
  setTimeout(resetStatus, 2000);
  
  render();
}

// Manual save
function save() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!amt || amt <= 0) {
    show('❌ Введите сумму');
    return;
  }
  
  const cur = document.getElementById('cur').value;
  const cat = document.getElementById('cat').value;
  const loc = document.getElementById('loc').value;
  
  const rate = EUR_RATES[cur] || 1;
  const eur = amt * rate;
  
  data.unshift({
    id: Date.now(),    amt: amt,
    cur: cur,
    cat: cat,
    eur: eur,
    loc: loc,
    lat: lat,
    lng: lng,
    date: new Date().toISOString()
  });
  
  localStorage.setItem('tc_data', JSON.stringify(data));
  
  document.getElementById('amt').value = '';
  document.getElementById('loc').value = '';
  
  show('✅ ' + amt + ' ' + cur + ' = €' + eur.toFixed(2));
  render();
}

// Delete
function del(id) {
  if (!confirm('Удалить?')) return;
  data = data.filter(x => x.id !== id);
  localStorage.setItem('tc_data', JSON.stringify(data));
  render();
}

// Clear all
function clr() {
  if (!confirm('Очистить ВСЁ?')) return;
  data = [];
  localStorage.removeItem('tc_data');
  render();
  show('🗑️ Очищено');
}

// Open in Google Maps
function openMap(lat, lng, loc) {
  if (!lat || !lng) {
    show('📍 Нет координат');
    return;
  }
  
  const url = 'https://www.google.com/maps/place/' + lat + ',' + lng + '/@' + lat + ',' + lng + ',17z';
  window.open(url, '_blank');
}

// Load
function load() {
  try {    const d = localStorage.getItem('tc_data');
    if (d) data = JSON.parse(d);
  } catch(e) { data = []; }
}

// Render
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  marks.forEach(m => map.removeLayer(m));
  marks = [];
  
  let tot = 0;
  
  if (data.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px">Нет записей<br><small>Нажми 🎤 ГОВОРИ</small></div>';
  } else {
    data.forEach(function(x) {
      tot += x.eur || 0;
      
      const cats = {food:'🍔',fuel:'⛽',hotel:'🏨',other:'📦'};
      const curSymbols = {EUR:'€',USD:'$',TRY:'₺',GBP:'£'};
      
      const div = document.createElement('div');
      div.className = 'item';
      div.onclick = function() { openMap(x.lat, x.lng, x.loc); };
      
      let locHtml = '';
      if (x.loc && x.loc !== 'Unknown' && x.loc !== 'GPS off' && x.loc !== 'No GPS') {
        locHtml = '<div class="loc clickable" onclick="event.stopPropagation();openMap(' + x.lat + ',' + x.lng + ',\'' + x.loc + '\')">📍 ' + x.loc + '</div>';
      } else if (x.lat && x.lng) {
        locHtml = '<div class="loc clickable" onclick="event.stopPropagation();openMap(' + x.lat + ',' + x.lng + ',\'' + x.lat.toFixed(4) + ',' + x.lng.toFixed(4) + '\')">📍 ' + x.lat.toFixed(4) + ', ' + x.lng.toFixed(4) + '</div>';
      }
      
      div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:1.1rem">' + curSymbols[x.cur] + x.amt + ' ' + x.cur + '</b></div><span style="color:#22c55e;font-weight:bold">€' + (x.eur||0).toFixed(2) + '</span></div>' +
        locHtml +
        '<div style="font-size:0.85rem;color:#666;margin:5px 0">' + (cats[x.cat]||'📦') + ' • ' + new Date(x.date).toLocaleDateString('ru-RU') + '</div>' +
        '<button class="red" onclick="event.stopPropagation();del(' + x.id + ')" style="padding:8px;margin-top:8px">🗑️ Удалить</button>';
      
      list.appendChild(div);
      
      if (x.lat && x.lng) {
        const m = L.marker([x.lat, x.lng]).addTo(map);
        m.bindPopup('<b>' + curSymbols[x.cur] + x.amt + ' ' + x.cur + '</b><br>€' + (x.eur||0).toFixed(2) + '<br>' + (x.loc||''));
        marks.push(m);
      }
    });
  }
    document.getElementById('tot').textContent = '€' + tot.toFixed(2);
  
  if (marks.length > 0) {
    const b = L.latLngBounds(marks.map(m => m.getLatLng()));
    map.fitBounds(b.pad(0.1));
  }
}

// Export
function exp() {
  if (data.length === 0) { show('Нет данных'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'travelcar-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  show('📤 Экспортировано');
}

// Reset status
function resetStatus() {
  const s = document.getElementById('autoStatus');
  s.textContent = '🎤 Готов к голосовому вводу';
  s.className = 'auto';
}

// Toast
function show(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2500);
}
</script>

</body>
</html>
