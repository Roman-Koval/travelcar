<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelCar</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}
button{width:100%;padding:20px;margin:10px 0;border:none;border-radius:12px;font-size:1.1rem;cursor:pointer}
.green{background:#22c55e;color:#fff}
.blue{background:#3b82f6;color:#fff}
input,select{width:100%;padding:15px;margin:10px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:1rem}
.item{background:#1e293b;padding:15px;margin:10px 0;border-radius:8px;border-left:4px solid #22c55e}
#map{height:200px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<h1>🚗 TravelCar</h1>

<button class="blue" onclick="speak()">🎤 ГОВОРИ</button>
<div id="txt" style="text-align:center;color:#94a3b8;margin:10px 0;"></div>

<input type="number" id="amt" placeholder="Сумма" step="0.01">
<select id="cur"><option value="EUR">€ EUR</option><option value="USD">$ USD</option><option value="TRY">₺ TRY</option></select>
<select id="cat"><option value="food">🍔 Еда</option><option value="fuel">⛽ Топливо</option><option value="hotel">🏨 Отель</option></select>
<input type="text" id="loc" placeholder="Город" readonly>

<button class="green" onclick="save()">💾 СОХРАНИТЬ</button>

<div id="list"></div>
<div id="total" style="font-size:1.5rem;text-align:center;margin:20px 0;">€0.00</div>
<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script>
// ⚠️ ЗАМЕНИ ЭТО НА СВОЙ FIREBASE CONFIG!
const firebaseConfig = {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
};

// Проверка config
if (firebaseConfig.apiKey.includes('XXXX') || !firebaseConfig.apiKey) {  alert('⚠️ НАСТРОЙ FIREBASE!\n1. Создай проект на console.firebase.google.com\n2. Включи Anonymous Auth\n3. Создай Firestore\n4. Скопируй config сюда');
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let user = null;
let expenses = [];
let map = L.map('map').setView([50, 10], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers = [];

// Voice
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Открой в Chrome'); return; }
  
  const r = new SR();
  r.lang = 'ru-RU';
  const txt = document.getElementById('txt');
  
  txt.textContent = '🔴 Говорите...';
  
  r.onresult = e => {
    const t = e.results[0][0].transcript;
    txt.textContent = '"' + t + '"';
    parse(t);
  };
  
  r.onerror = e => {
    txt.textContent = 'Ошибка: ' + e.error;
    console.error(e);
  };
  
  r.start();
}

// Parse voice
function parse(text) {
  const lower = text.toLowerCase();
  
  // Amount - replace comma with dot
  const m = lower.match(/(\d+[.,]?\d*)/);
  let amount = m ? parseFloat(m[1].replace(',', '.')) : 0;
  
  // Currency
  let cur = 'EUR';
  if (/лир/i.test(lower)) cur = 'TRY';
  else if (/дол/i.test(lower)) cur = 'USD';
  
  // Category  let cat = 'food';
  if (/бензин|топливо/i.test(lower)) cat = 'fuel';
  else if (/отель|гостиниц/i.test(lower)) cat = 'hotel';
  
  document.getElementById('amt').value = amount;
  document.getElementById('cur').value = cur;
  document.getElementById('cat').value = cat;
  
  // Auto get location
  navigator.geolocation.getCurrentPosition(async pos => {
    const {latitude: lat, longitude: lng} = pos.coords;
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
      const d = await r.json();
      document.getElementById('loc').value = d.address?.city || d.address?.town || 'Unknown';
      window._lat = lat;
      window._lng = lng;
    } catch(e) {
      document.getElementById('loc').value = 'No location';
    }
  });
}

// Save
async function save() {
  const amount = parseFloat(document.getElementById('amt').value);
  const currency = document.getElementById('cur').value;
  const category = document.getElementById('cat').value;
  const city = document.getElementById('loc').value;
  
  if (!amount || amount <= 0) {
    alert('Введите сумму!');
    return;
  }
  
  if (!user) {
    alert('Нет авторизации!');
    return;
  }
  
  // Simple EUR conversion
  const rates = {EUR: 1, USD: 0.92, TRY: 0.029};
  const eur = amount * (rates[currency] || 1);
  
  try {
    await db.collection('expenses').add({
      amount, currency, category, eur, city,
      lat: window._lat || null,
      lng: window._lng || null,
      date: new Date(),      userId: user.uid
    });
    
    document.getElementById('amt').value = '';
    document.getElementById('loc').value = '';
    document.getElementById('txt').textContent = '✅ Сохранено!';
    setTimeout(() => document.getElementById('txt').textContent = '', 2000);
  } catch(e) {
    alert('Ошибка: ' + e.message);
    console.error(e);
  }
}

// Auth
firebase.auth().onAuthStateChanged(u => {
  if (u) {
    user = u;
    console.log('Auth:', u.uid);
    
    db.collection('expenses')
      .where('userId', '==', u.uid)
      .orderBy('date', 'desc')
      .onSnapshot(snap => {
        expenses = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render();
      });
  } else {
    firebase.auth().signInAnonymously();
  }
});

// Render
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  
  let total = 0;
  
  expenses.forEach(e => {
    total += e.eur || 0;
    
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between">
        <b>${e.amount} ${e.currency}</b>
        <span>€${(e.eur||0).toFixed(2)}</span>
      </div>      <div style="color:#94a3b8;margin:5px 0">${e.city || ''}</div>
      <button onclick="del('${e.id}')" style="background:#ef4444;color:#fff;padding:8px;margin:5px 0">Удалить</button>
    `;
    list.appendChild(div);
    
    if (e.lat && e.lng) {
      const m = L.marker([e.lat, e.lng]).addTo(map);
      m.bindPopup(`${e.amount} ${e.currency}<br>${e.city||''}`);
      markers.push(m);
    }
  });
  
  document.getElementById('total').textContent = '€' + total.toFixed(2);
  
  if (markers.length > 0) {
    const g = new L.featureGroup(markers);
    map.fitBounds(g.getBounds().pad(0.1));
  }
}

// Delete
async function del(id) {
  if (confirm('Удалить?')) {
    await db.collection('expenses').doc(id).delete();
  }
}
</script>
</body>
</html>
